<svg xmlns="http://www.w3.org/2000/svg" width="320" height="160" viewBox="0 0 320 160" fill="none">
  <!-- Calendar Card 1: Main Monthly Booking Calendar Sheet -->
  <g transform="translate(18, 16)" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top Hanging Binder Rings -->
    <line x1="24" y1="2" x2="24" y2="10" stroke-width="2.5" />
    <line x1="68" y1="2" x2="68" y2="10" stroke-width="2.5" />
    <line x1="112" y1="2" x2="112" y2="10" stroke-width="2.5" />

    <!-- Calendar Body -->
    <rect x="6" y="8" width="124" height="116" rx="10" fill="rgba(255, 255, 255, 0.08)" />
    <!-- Header Month Strip -->
    <rect x="6" y="8" width="124" height="28" rx="10" fill="rgba(255, 255, 255, 0.18)" />
    <line x1="6" y1="36" x2="130" y2="36" />
    
    <!-- Mini Month Text Indicator -->
    <text x="68" y="27" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#ffffff" stroke="none" letter-spacing="1.5">OCTOBER &bull; 2026</text>

    <!-- Calendar Day Grid Lines / Dots -->
    <!-- Row 1 -->
    <circle cx="22" cy="50" r="3" fill="rgba(255, 255, 255, 0.5)" stroke="none" />
    <circle cx="42" cy="50" r="3" fill="rgba(255, 255, 255, 0.5)" stroke="none" />
    <circle cx="62" cy="50" r="3" fill="rgba(255, 255, 255, 0.5)" stroke="none" />
    <circle cx="82" cy="50" r="3" fill="rgba(255, 255, 255, 0.5)" stroke="none" />
    <circle cx="102" cy="50" r="3" fill="rgba(255, 255, 255, 0.5)" stroke="none" />
    <circle cx="120" cy="50" r="3" fill="rgba(255, 255, 255, 0.5)" stroke="none" />

    <!-- Row 2 -->
    <circle cx="22" cy="68" r="3" fill="rgba(255, 255, 255, 0.5)" stroke="none" />
    <circle cx="42" cy="68" r="3" fill="rgba(255, 255, 255, 0.5)" stroke="none" />
    <!-- Highlighted Booking Date Range (Check-in to Check-out) -->
    <rect x="52" y="59" width="58" height="18" rx="9" fill="rgba(255, 255, 255, 0.35)" stroke="none" />
    <circle cx="62" cy="68" r="5" fill="#ffffff" stroke="none" />
    <circle cx="82" cy="68" r="3" fill="#ffffff" stroke="none" />
    <circle cx="102" cy="68" r="5" fill="#ffffff" stroke="none" />
    <circle cx="120" cy="68" r="3" fill="rgba(255, 255, 255, 0.5)" stroke="none" />

    <!-- Row 3 -->
    <circle cx="22" cy="86" r="3" fill="rgba(255, 255, 255, 0.5)" stroke="none" />
    <circle cx="42" cy="86" r="3" fill="rgba(255, 255, 255, 0.5)" stroke="none" />
    <circle cx="62" cy="86" r="3" fill="rgba(255, 255, 255, 0.5)" stroke="none" />
    <circle cx="82" cy="86" r="3" fill="rgba(255, 255, 255, 0.5)" stroke="none" />
    <!-- Confirmed Date Star -->
    <polygon points="102,81 104,85 108,86 105,89 106,93 102,91 98,93 99,89 96,86 100,85" fill="#ffffff" stroke="none" />
    <circle cx="120" cy="86" r="3" fill="rgba(255, 255, 255, 0.5)" stroke="none" />

    <!-- Row 4 -->
    <circle cx="22" cy="104" r="3" fill="rgba(255, 255, 255, 0.4)" stroke="none" />
    <circle cx="42" cy="104" r="3" fill="rgba(255, 255, 255, 0.4)" stroke="none" />
    <circle cx="62" cy="104" r="3" fill="rgba(255, 255, 255, 0.4)" stroke="none" />
    <circle cx="82" cy="104" r="3" fill="rgba(255, 255, 255, 0.4)" stroke="none" />
    <circle cx="102" cy="104" r="3" fill="rgba(255, 255, 255, 0.4)" stroke="none" />
    <circle cx="120" cy="104" r="3" fill="rgba(255, 255, 255, 0.4)" stroke="none" />
  </g>

  <!-- Calendar Element 2: Check-in / Reservation Ticket Pill -->
  <g transform="translate(186, 22)" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="114" height="52" rx="8" fill="rgba(255, 255, 255, 0.07)" stroke-dasharray="4 3" />
    <circle cx="14" cy="26" r="4" fill="rgba(255, 255, 255, 0.3)" stroke="none" />
    <text x="24" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold" fill="#ffffff" stroke="none" letter-spacing="1">CHECK-IN</text>
    <text x="24" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" fill="#ffffff" stroke="none">2:00 PM</text>
    <path d="M96 20 L100 24 L108 16" stroke="#ffffff" stroke-width="2" fill="none" />
  </g>

  <!-- Calendar Element 3: Turnkey Booking Clock & Date Ribbon -->
  <g transform="translate(186, 88)" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Clock face -->
    <circle cx="18" cy="24" r="14" fill="rgba(255, 255, 255, 0.08)" />
    <line x1="18" y1="24" x2="18" y2="16" stroke-width="1.6" />
    <line x1="18" y1="24" x2="24" y2="24" stroke-width="1.6" />
    <circle cx="18" cy="24" r="1.5" fill="#ffffff" stroke="none" />

    <!-- Date tag -->
    <rect x="42" y="10" width="72" height="28" rx="6" fill="rgba(255, 255, 255, 0.12)" />
    <text x="78" y="27" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="bold" fill="#ffffff" stroke="none" letter-spacing="1">100% PRIVATE</text>
  </g>

  <!-- Decorative Sparkles / Floating Crosses -->
  <g fill="#ffffff" opacity="0.6">
    <path d="M165 40 Q165 46 170 46 Q165 46 165 52 Q165 46 160 46 Q165 46 165 40 Z" />
    <path d="M305 75 Q305 80 309 80 Q305 80 305 85 Q305 80 301 80 Q305 80 305 75 Z" />
    <path d="M10 135 Q10 139 14 139 Q10 139 10 143 Q10 139 6 139 Q10 139 10 135 Z" />
  </g>
</svg>
