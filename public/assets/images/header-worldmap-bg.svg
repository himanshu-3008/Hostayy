<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 240" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background Gradient: Deep luxury wine-crimson edges to radiant coral red center -->
    <radialGradient id="bgRadiant" cx="50%" cy="55%" r="65%">
      <stop offset="0%" stop-color="#ea384c" stop-opacity="0.96"/>
      <stop offset="40%" stop-color="#be1226" stop-opacity="0.98"/>
      <stop offset="75%" stop-color="#7a0a17" stop-opacity="1"/>
      <stop offset="100%" stop-color="#4c040c" stop-opacity="1"/>
    </radialGradient>

    <!-- World Map Silhouette Gradient -->
    <linearGradient id="mapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7b8d" stop-opacity="0.88"/>
      <stop offset="50%" stop-color="#ff445b" stop-opacity="0.94"/>
      <stop offset="100%" stop-color="#d91632" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Horizon Laser Beam Glow -->
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea384c" stop-opacity="0"/>
      <stop offset="15%" stop-color="#ff6b7e" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="85%" stop-color="#ff6b7e" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ea384c" stop-opacity="0"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Coral Red Backdrop -->
  <rect width="1600" height="240" fill="url(#bgRadiant)" />

  <!-- Perspective Horizon Grid at the Base -->
  <g stroke="#ff4d63" stroke-opacity="0.32" stroke-width="1">
    <!-- Horizontal Coordinate Grid Lines -->
    <line x1="0" y1="182" x2="1600" y2="182" stroke-opacity="0.25"/>
    <line x1="0" y1="195" x2="1600" y2="195" stroke-opacity="0.35"/>
    <line x1="0" y1="208" x2="1600" y2="208" stroke-opacity="0.45"/>
    <line x1="0" y1="222" x2="1600" y2="222" stroke-opacity="0.58"/>
    <line x1="0" y1="237" x2="1600" y2="237" stroke-opacity="0.75"/>

    <!-- Vertical Perspective Lines -->
    <line x1="120" y1="240" x2="280" y2="182" stroke-opacity="0.35"/>
    <line x1="240" y1="240" x2="360" y2="182" stroke-opacity="0.3"/>
    <line x1="360" y1="240" x2="440" y2="182" stroke-opacity="0.28"/>
    <line x1="480" y1="240" x2="520" y2="182" stroke-opacity="0.22"/>
    <line x1="600" y1="240" x2="610" y2="182" stroke-opacity="0.18"/>
    
    <line x1="1000" y1="240" x2="990" y2="182" stroke-opacity="0.18"/>
    <line x1="1120" y1="240" x2="1080" y2="182" stroke-opacity="0.22"/>
    <line x1="1240" y1="240" x2="1160" y2="182" stroke-opacity="0.28"/>
    <line x1="1360" y1="240" x2="1240" y2="182" stroke-opacity="0.3"/>
    <line x1="1480" y1="240" x2="1320" y2="182" stroke-opacity="0.35"/>
  </g>

  <!-- Concentric Radar Flight / Range Rings -->
  <g fill="none" stroke="#ff4d63" stroke-opacity="0.38" stroke-width="1.4">
    <circle cx="780" cy="210" r="75" stroke-dasharray="5 4"/>
    <circle cx="780" cy="210" r="150" />
    <circle cx="780" cy="210" r="230" stroke-dasharray="10 5"/>
    <circle cx="780" cy="210" r="325" />
    <circle cx="780" cy="210" r="440" stroke-dasharray="8 5"/>
    <circle cx="780" cy="210" r="570" stroke-opacity="0.24"/>
    <circle cx="780" cy="210" r="710" stroke-opacity="0.15"/>
  </g>

  <!-- Luminous Horizon Laser Line -->
  <line x1="0" y1="195" x2="1600" y2="195" stroke="url(#beamGrad)" stroke-width="2.2" filter="url(#glow)"/>

  <!-- World Map Silhouettes (Continents Outlines matching user photo) -->
  <g fill="url(#mapGrad)" opacity="0.9" filter="url(#glow)">
    <!-- NORTH AMERICA -->
    <path d="M190,68 Q220,55 260,54 Q310,52 350,62 Q385,58 410,50 Q430,48 440,60 Q450,75 445,90 Q430,105 410,115 Q405,128 380,135 Q370,145 362,160 Q352,165 345,158 Q335,148 325,145 Q305,145 295,138 Q270,135 255,120 Q235,112 220,100 Q205,95 190,82 Z" />
    <!-- Greenland -->
    <path d="M445,32 Q470,28 490,35 Q500,48 485,58 Q460,62 450,48 Z" />
    <!-- Central America & isles -->
    <path d="M345,160 Q355,170 365,175 Q375,185 368,192 Q360,188 350,178 Z" />
    <circle cx="390" cy="168" r="3" />
    <circle cx="405" cy="174" r="2.5" />

    <!-- SOUTH AMERICA -->
    <path d="M370,186 Q390,183 410,188 Q435,196 450,208 Q460,222 450,236 Q425,238 410,233 Q395,223 385,208 Q372,196 370,186 Z" />

    <!-- EUROPE -->
    <path d="M695,65 Q725,52 760,55 Q785,62 795,78 Q780,92 755,95 Q735,102 710,100 Q690,92 688,80 Z" />
    <!-- UK & Scandinavia -->
    <path d="M665,60 Q680,56 682,68 Q675,78 662,72 Z" />
    <path d="M730,32 Q750,28 765,40 Q755,55 740,50 Z" />

    <!-- AFRICA -->
    <path d="M685,102 Q720,95 765,102 Q805,112 815,132 Q825,158 810,182 Q790,202 765,218 Q750,222 740,212 Q725,182 700,158 Q680,142 672,122 Q670,112 685,102 Z" />
    <!-- Madagascar -->
    <path d="M828,182 Q836,178 838,192 Q832,208 825,202 Z" />

    <!-- ASIA & MIDDLE EAST -->
    <path d="M800,72 Q845,52 905,50 Q965,48 1035,55 Q1095,60 1145,72 Q1170,88 1160,108 Q1125,118 1075,116 Q1045,122 1015,138 Q1000,152 980,162 Q960,158 945,140 Q920,128 885,122 Q845,118 820,102 Q805,92 800,72 Z" />
    <!-- Indian Subcontinent (Prominent hostayy hub) -->
    <path d="M940,122 Q970,126 985,142 Q980,165 960,180 Q945,170 935,148 Q932,132 940,122 Z" />
    <!-- Japan & East Asia islands -->
    <path d="M1175,80 Q1190,78 1192,90 Q1182,102 1170,96 Z" />
    <path d="M1155,112 Q1170,120 1160,132 Q1150,128 1155,112 Z" />
    <!-- Southeast Asia -->
    <path d="M1035,142 Q1060,148 1070,162 Q1055,172 1040,162 Z" />
    <circle cx="1080" cy="175" r="3.5" />
    <circle cx="1100" cy="182" r="4" />

    <!-- AUSTRALIA & OCEANIA -->
    <path d="M1135,172 Q1175,162 1220,170 Q1255,182 1250,208 Q1225,225 1180,222 Q1145,212 1132,195 Q1130,182 1135,172 Z" />
    <!-- New Zealand -->
    <path d="M1275,212 Q1288,208 1290,220 Q1280,228 1272,222 Z" />
  </g>

  <!-- Glowing Strategic Travel Nodes (Delhi/Yashobhoomi, London, NYC, Tokyo, Sydney) -->
  <g filter="url(#glow)">
    <!-- Delhi / Yashobhoomi IICC Focal Beacon -->
    <circle cx="952" cy="136" r="15" fill="#ffffff" fill-opacity="0.22" />
    <circle cx="952" cy="136" r="8" fill="#ff3d54" fill-opacity="0.8" />
    <circle cx="952" cy="136" r="4" fill="#ffffff" />

    <!-- London Hub -->
    <circle cx="675" cy="70" r="3.5" fill="#ffffff" fill-opacity="0.9" />
    <circle cx="675" cy="70" r="9" fill="#ff5268" fill-opacity="0.3" />

    <!-- New York Hub -->
    <circle cx="365" cy="88" r="3.5" fill="#ffffff" fill-opacity="0.9" />
    <circle cx="365" cy="88" r="8" fill="#ff5268" fill-opacity="0.3" />

    <!-- Dubai Hub -->
    <circle cx="860" cy="115" r="3" fill="#ffffff" />
    
    <!-- Tokyo Hub -->
    <circle cx="1180" cy="88" r="3.5" fill="#ffffff" />

    <!-- Sydney Hub -->
    <circle cx="1230" cy="202" r="4" fill="#ffffff" />
    <circle cx="1230" cy="202" r="10" fill="#ff5268" fill-opacity="0.35" />
  </g>

  <!-- Luminous Atmospheric Bokeh Orbs (Exact match to reference photo) -->
  <g fill="#ffffff" opacity="0.18" filter="url(#glow)">
    <circle cx="255" cy="162" r="28" fill="#ff4d63" opacity="0.45"/>
    <circle cx="275" cy="192" r="16" fill="#ffffff" opacity="0.65"/>
    <circle cx="495" cy="188" r="22" fill="#ff334b" opacity="0.35"/>
    <circle cx="995" cy="212" r="14" fill="#ffffff" opacity="0.75"/>
    <circle cx="1195" cy="142" r="25" fill="#ff5268" opacity="0.4"/>
    <circle cx="1255" cy="158" r="34" fill="#ff223d" opacity="0.3"/>
  </g>
</svg>
